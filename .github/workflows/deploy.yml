name: Deploy to GitHub Pages

# push 到 main 自动构建并发布；也可以在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要的权限：读代码、写 Pages、用 OIDC 换取部署凭证
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的 push 顶掉排队中的旧任务（正在跑的不打断）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run build = tsc -b && vite build，产物在 dist/
      # public/webgl 会被 Vite 原样拷进 dist/webgl，WebGL 试玩资源一起发布
      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
